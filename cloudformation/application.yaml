AWSTemplateFormatVersion: '2010-09-09'

Description: Student Management System Application Infrastructure

Resources:

  StudentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Student Management System
      VpcId: vpc-02417f89c9f09be65
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 223.233.81.131/32
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 223.233.81.131/32
      Tags:
        - Key: Name
          Value: student-management-cft-sg

Outputs:

  SecurityGroupId:
    Description: Application Security Group ID
    Value: !Ref StudentSecurityGroup

